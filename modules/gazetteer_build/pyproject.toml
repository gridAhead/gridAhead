[project]
name = "gazetteer-build"
version = "0.1.0"
description = "Build the gazetteer SQLite file from local place, station and DSO area files."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
]

[project.scripts]
gazetteer-build = "gazetteer_build:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "PLW1514"]
preview = true
explicit-preview-rules = true
