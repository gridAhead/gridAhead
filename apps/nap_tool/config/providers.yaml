# VNBdigital is the shared source for the currently known NAP providers.
# `nap-tool discover` records providers and their current NAPs there; `download`
# then consumes pending candidates. No per-provider entries are necessary.
# Keep `providers` for future exceptions
# whose documents are not available through VNBdigital.
vnbdigital:
  enabled: true
  graphql_url: "https://www.vnbdigital.de/gateway/graphql"

providers: []
