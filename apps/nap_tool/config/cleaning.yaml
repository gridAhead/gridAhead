units:
  money:
    canonical: "€"
    aliases: {"€": 1, "T€": 1000, "Tsd. €": 1000, "Mio. €": 1000000, "Mio €": 1000000, "Mio.": 1000000}
  length:
    canonical: "km"
    aliases: {"km": 1, "m": 0.001}
  apparent_power:
    canonical: "MVA"
    aliases: {"MVA": 1, "kVA": 0.001}
  active_power:
    canonical: "MW"
    aliases: {"MW": 1, "kW": 0.001}
