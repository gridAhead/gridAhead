[project]
name = "nap-tool"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "filelock>=3.13",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
docling = ["docling>=2.60"]
llamaparse = ["llama-cloud>=0.1"]
llmpdf = ["llmPDF==0.7.1"]
all-extractors = [
    "docling>=2.60",
    "llama-cloud>=0.1",
    "llmPDF==0.7.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.12",
]

[project.scripts]
nap-tool = "nap_tool.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "/data/",
    "/data.zip",
    "/src/nap_tool/ui/frontend/",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
