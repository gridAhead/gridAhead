    "2026 Jakob Ortmann <https://github.com/ortimis> © Goal100 GmbH",
    "2026 Kevin Krämer <https://github.com/kvnkrmr> © Goal100 GmbH",
    "2026 Rosmarie Debski <https://github.com/Glitterrosie> © Goal100 GmbH",
    "2026 Hendrik Huyskens <https://github.com/henhuy> © Reiner Lemoine Institut",
    "2026 Jonathan Amme <https://github.com/nesnoj> © Reiner Lemoine Institut",
    "2026 Bahne Carstensen <https://github.com/bahne-io> © Goal100 GmbH",
]
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
