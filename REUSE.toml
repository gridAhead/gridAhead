version = 1
SPDX-PackageName = "gridAhead"
SPDX-PackageDownloadLocation = "https://github.com/gridAhead/gridAhead"

# Licensing at a glance:
# - Code and configuration: Apache-2.0
# - Website prose (apps/docs/content/): CC-BY-4.0
# - Website graphics (apps/docs/public/images/): CC-BY-4.0
# - Citation metadata (CITATION.cff): CC0-1.0
# - Logos and icons: LicenseRef-AllRightsReserved (not openly licensed)
#
# Files that carry an inline SPDX header keep it; the annotations below cover
# files without one. If several annotations match a file, the last one wins.

# --- Repository root and website ----------------------------------------------

[[annotations]]
path = [
    ".gitignore",
    ".prettierignore",
    "README.md",
    "CHANGELOG.md",
    "package.json",
    "pnpm-lock.yaml",
    "pnpm-workspace.yaml",
    "turbo.json",
    ".github/**",
    "apps/docs/**",
]
